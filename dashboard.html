<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - A-One Books</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>A-One Books Admin</h2>
            <nav>
                <button class="nav-btn active">📚 Manage Inventory</button>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <header>
                <h1>Manage Book Inventory</h1>
                <p>Upload new books or remove existing titles</p>
            </header>

            <div class="dashboard-grid">
                <!-- Upload Form -->
                <div class="card">
                    <h3>Add New Book</h3>
                    <form id="productForm">
                        <div class="form-group">
                            <label for="productName">Book Title</label>
                            <input type="text" id="productName" placeholder="e.g., The Great Gatsby" required>
                        </div>

                        <div class="form-group">
                            <label for="productPrice">Price</label>
                            <input type="text" id="productPrice" placeholder="e.g., $25.00" required>
                        </div>

                        <div class="form-group">
                            <label for="productImage">Book Cover Image</label>
                            <input type="file" id="productImage" accept="image/*" required>
                            <div id="imagePreview" class="image-preview" style="display: none;"></div>
                        </div>

                        <button type="submit" class="btn-primary">Add to Inventory</button>
                    </form>
                </div>

                <!-- Current Inventory -->
                <div class="card">
                    <h3>Current Inventory (<span id="inventoryCount">0</span>)</h3>
                    <div id="inventoryList" class="inventory-list">
                        <p class="empty-message">No books added yet.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
