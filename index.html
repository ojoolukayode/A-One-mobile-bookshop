<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-One - Premium Goods</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>A-One</h1>
            <p>Your premium destination for quality goods</p>
        </div>
    </header>

    <main class="container">
        <section class="inventory-section">
            <h2>Our Products</h2>
            <div id="productGrid" class="product-grid">
                <p class="empty-message">No products available yet.</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 A-One. All rights reserved.</p>
            <a href="admin.html" class="admin-link">Admin Portal</a>
        </div>
    </footer>

    <script>
        // Load and display inventory from localStorage
        function loadInventory() {
            const inventory = JSON.parse(localStorage.getItem('siteInventory') || '[]');
            const productGrid = document.getElementById('productGrid');
            
            if (inventory.length === 0) {
                productGrid.innerHTML = '<p class="empty-message">No products available yet.</p>';
                return;
            }

            productGrid.innerHTML = inventory.map(item => `
                <div class="product-card">
                    <img src="${item.image}" alt="${item.name}" class="product-image">
                    <div class="product-info">
                        <h3 class="product-name">${item.name}</h3>
                        <p class="product-price">${item.price}</p>
                    </div>
                </div>
            `).join('');
        }

        // Load inventory when page loads
        loadInventory();
    </script>
</body>
</html>
